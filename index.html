<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 Willst du mein Valentine sein? 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #ff6b9d 0%, #ffc3d2 50%, #ff85a1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Floating Hearts Animation */
        .heart-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .floating-heart {
            position: absolute;
            font-size: 20px;
            opacity: 0.6;
            animation: float-up 8s infinite ease-in;
        }

        @keyframes float-up {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0.6;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 50px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.4);
            max-width: 500px;
            width: 90%;
            backdrop-filter: blur(10px);
            border: 3px solid #ff69b4;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .welcome-screen {
            display: block;
        }

        .form-screen {
            display: none;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: #ff1493;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(255, 105, 180, 0.3);
        }

        .heart-icon {
            font-size: 4em;
            animation: heartbeat 1.5s infinite;
            display: inline-block;
            margin: 20px 0;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            25% {
                transform: scale(1.1);
            }
            50% {
                transform: scale(1);
            }
            75% {
                transform: scale(1.15);
            }
        }

        .welcome-text {
            font-size: 1.2em;
            color: #d63384;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn {
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(255, 20, 147, 0.3);
            font-family: 'Quicksand', sans-serif;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(255, 20, 147, 0.4);
            background: linear-gradient(135deg, #ff69b4, #ff1493);
        }

        /* Form Styling */
        .question {
            font-size: 1.8em;
            color: #ff1493;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .form-group {
            margin: 25px 0;
        }

        label {
            display: block;
            font-size: 1.1em;
            color: #d63384;
            margin-bottom: 10px;
            font-weight: 600;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 12px 20px;
            font-size: 1em;
            border: 2px solid #ffb3d9;
            border-radius: 25px;
            font-family: 'Quicksand', sans-serif;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus {
            outline: none;
            border-color: #ff69b4;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.3);
        }

        .radio-group {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 30px 0;
        }

        .radio-option {
            position: relative;
        }

        .radio-option input[type="radio"] {
            position: absolute;
            opacity: 0;
        }

        .radio-label {
            display: inline-block;
            padding: 15px 35px;
            background: #fff;
            border: 3px solid #ffb3d9;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1em;
            font-weight: 600;
            color: #d63384;
        }

        .radio-option input[type="radio"]:checked + .radio-label {
            background: linear-gradient(135deg, #ff1493, #ff69b4);
            color: white;
            border-color: #ff1493;
            transform: scale(1.05);
        }

        .radio-label:hover {
            border-color: #ff69b4;
            transform: translateY(-2px);
        }

        .submit-btn {
            margin-top: 30px;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 15px;
            font-weight: 600;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        /* Sparkles */
        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            animation: sparkle 2s infinite;
            pointer-events: none;
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0;
                transform: scale(0);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <!-- Floating Hearts Background -->
    <div class="heart-background" id="heartBackground"></div>

    <div class="container">
        <!-- Welcome Screen -->
        <div class="welcome-screen" id="welcomeScreen">
            <div class="heart-icon">❤️</div>
            <h1>Hallo mein Schatz! 💕</h1>
            <p class="welcome-text">
                Ich habe etwas Besonderes für dich vorbereitet...<br>
                Eine Frage, die von Herzen kommt! 💖
            </p>
            <button class="btn" onclick="showForm()">Weiter zur Überraschung ✨</button>
        </div>

        <!-- Form Screen -->
        <div class="form-screen" id="formScreen">
            <div class="heart-icon">💘</div>
            <p class="question">Willst du mein Valentine sein? 💕</p>
            
            <form id="valentineForm" action="https://formspree.io/f/xlgwdavz"method="POST">
                <div class="form-group">
                    <label for="name">Dein Name:</label>
                    <input type="text" id="name" name="name" required placeholder="Gib deinen Namen ein...">
                </div>

                <div class="form-group">
                    <label for="email">Deine E-Mail:</label>
                    <input type="email" id="email" name="email" required placeholder="deine@email.de">
                </div>

                <div class="form-group">
                    <label>Deine Antwort:</label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="yes" name="answer" value="Ja" required>
                            <label for="yes" class="radio-label">💖 Ja!</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="no" name="answer" value="Nein">
                            <label for="no" class="radio-label">💔 Nein</label>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn submit-btn">Antwort absenden 💌</button>
            </form>

            <div class="message" id="message"></div>
        </div>
    </div>

    <script>
        // Create floating hearts
        function createFloatingHearts() {
            const heartBackground = document.getElementById('heartBackground');
            const hearts = ['❤️', '💕', '💖', '💗', '💓', '💝'];
            
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
                heart.style.animationDuration = (Math.random() * 4 + 6) + 's';
                heartBackground.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 10000);
            }, 500);
        }

        // Show form screen
        function showForm() {
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('formScreen').style.display = 'block';
            createSparkles();
        }

        // Create sparkles effect
        function createSparkles() {
            const container = document.querySelector('.container');
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const sparkle = document.createElement('div');
                    sparkle.className = 'sparkle';
                    sparkle.style.left = Math.random() * 100 + '%';
                    sparkle.style.top = Math.random() * 100 + '%';
                    sparkle.style.animationDelay = Math.random() * 2 + 's';
                    container.appendChild(sparkle);
                }, i * 100);
            }
        }

        // Handle form submission
        document.getElementById('valentineForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const name = formData.get('name');
            const email = formData.get('email');
            const answer = formData.get('answer');
            
            const messageDiv = document.getElementById('message');
            
            try {
                // Send email using Formspree (free email service)
                const response = await fetch('https://formspree.io/f/xlgwdavz', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        answer: answer,
                        _replyto: 'alexhennig2002@gmail.com',
                        _subject: `Valentine Antwort von ${name}`,
                        message: `${name} (${email}) hat geantwortet: ${answer} 💕`
                    })
                });

                if (response.ok) {
                    messageDiv.className = 'message success';
                    messageDiv.style.display = 'block';
                    if (answer === 'Ja') {
                        messageDiv.textContent = '💖 Yay! Deine Antwort wurde versendet! Ich freue mich so sehr! 💕';
                    } else {
                        messageDiv.textContent = '💔 Deine Antwort wurde versendet. Schade... aber danke für deine Ehrlichkeit.';
                    }
                    e.target.reset();
                } else {
                    throw new Error('Fehler beim Senden');
                }
            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
                messageDiv.textContent = '❌ Fehler beim Senden. Bitte versuche es später erneut!';
            }
        });

        // Initialize floating hearts
        createFloatingHearts();
    </script>
</body>
</html>
